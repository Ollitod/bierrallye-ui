@if (isAdmin()) {
  <div class="button-container tertiary-button" (click)="openWinnersDialog()">
    <button mat-flat-button>Blitzauswertung</button>
  </div>
}

<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Auswertung Bierrallye 2025</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <bierrallye-shared-ui-expandable-dynamic-table
      [columnSpecs]="columnsSpecs"
      [data]="evaluations"
      [columnsExcludedFromSort]="['position']"
    >
      <ng-template brExpansionContent let-evaluation>
        <bierrallye-shared-ui-dynamic-table
          [columnSpecs]="detailColumnSpecs"
          [data]="evaluation.stationEvaluation"
          [disablePaginator]="true"
        />
      </ng-template>
      <ng-template
        [bierrallyeSharedUiCustomColumn]="'position'"
        let-index="index"
      >
        {{ index + 1 }}
      </ng-template>
    </bierrallye-shared-ui-expandable-dynamic-table>
  </mat-card-content>
</mat-card>
